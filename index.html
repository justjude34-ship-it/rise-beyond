<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Rise Beyond</title><!-- lake-hero-v3 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#070d16;color:#f4f0ff;font-family:system-ui,sans-serif}
#home{min-height:100dvh;background:#0b1426 url('https://raw.githubusercontent.com/justjude34-ship-it/rise-beyond/main/hero.jpg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 20px 32px}
button,a.btn{display:block;width:100%;min-height:56px;border:0;border-radius:999px;background:#3dd6c6;color:#06201c;font-weight:700;font-size:16px;text-align:center;line-height:56px;text-decoration:none;margin:12px 0}
.card{background:#121a28;border:1px solid rgba(61,214,198,.25);border-radius:16px;padding:16px;margin:10px 0}
#app{display:none;padding:18px 16px 40px;max-width:480px;margin:0 auto}

</head>
<body>
<div id="home"><button type="button" id="enter">Enter</button></div>
<div id="app"><h1>Rise Beyond</h1><div class="card"><strong>Still Water</strong><p>Lake at dusk.</p></div><div class="card"><strong>Sacred Center</strong><p>The Om.</p></div><div class="card"><strong>Wave Listen</strong><p>Sound moving through.</p></div><div class="card"><strong>Bowl Resonance</strong><p>One tone. A longer exhale.</p></div><a class="btn" href="tel:1800737732">1800RESPECT</a><a class="btn" href="tel:131114">Lifeline</a><button type="button" id="back">Back</button></div>
<script>
document.getElementById('enter').onclick=function(){document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';};
document.getElementById('back').onclick=function(){document.getElementById('app').style.display='none';document.getElementById('home').style.display='flex';};
</script>

</html>
